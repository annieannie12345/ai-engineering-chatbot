<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Engineering Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
    <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script defer src="{{ url_for('static', filename='js/chat.js') }}"></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Local AI Learning Workspace</p>
        <h1>AI Engineering Chatbot</h1>
      </div>
    </header>

    <main class="layout">
      <section class="chat-panel" aria-label="Chat conversation">
        <div id="messages" class="messages" aria-live="polite">
          <article class="message assistant">
            <div class="avatar">AI</div>
            <div class="bubble">Ask me anything about ML, RAG, LLMs, agents, or building AI systems.</div>
          </article>
        </div>

        <form id="chat-form" class="composer">
          <textarea
            id="message-input"
            name="message"
            rows="2"
            maxlength="4000"
            placeholder="Ask about ML, deep learning, RAG, LLMs, agents, evaluation, or MLOps"
            required
          ></textarea>
          <button class="icon-button primary" id="send-button" type="submit" aria-label="Send message" title="Send">
            <i data-lucide="send-horizontal"></i>
          </button>
          <button class="icon-button" id="clear-button" type="button" aria-label="Clear chat" title="Clear">
            <i data-lucide="trash-2"></i>
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
